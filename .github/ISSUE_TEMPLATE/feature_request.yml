name: Feature request
description: Suggest a new extension or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    id: target
    attributes:
      label: Target type
      description: Which Dart/Flutter type should this extend?
      placeholder: e.g. String, Iterable, BuildContext
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: What should the extension be named and how should it behave?
      render: dart
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Why is this useful? Is there an existing workaround?
    validations:
      required: true
